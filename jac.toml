[project]
name = "Replaniva"
version = "0.1.0"
description = "An adaptive personal planning secretary for everyday life"
default-app = "Replaniva"
jac-version = "==0.37.25"

[apps.Replaniva]
kind = "web-app"
entry-point = "main"
route = "/"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
platform = "android"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-native-web = "^0.19.13"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
[dev-dependencies.pypi]
watchdog = ">=3.0.0"


[client]

[dependencies.pypi]
cryptography = ">=41.0.0"

[client.assets]
dir = "assets"

[client.app_meta_data]
title = "Replaniva | Plans that adapt when life changes"
description = "A private personal planner with reviewable recovery when the day changes."
theme_color = "#171717"
icon = "/static/assets/replaniva-favicon.png"

[scale.admin]
enabled = false

[scale.scheduler]
enabled = true

[serve.access_log]
enabled = false

[serve.websocket]
allowed_origins = ["http://localhost:8100", "http://127.0.0.1:8100", "https://preview-jac-sbx-460bcc70e4f1459ea27552f5b0bd016a.jachammer.app"]

[placement.pins]
"endpoints" = "server"
"ai" = "server"
"secretary" = "server"
"secretary_ai" = "server"
"secretary_runtime" = "server"
"model_usage" = "server"
"calendar_gateway" = "server"

[byllm.model]
default_model = "gemini/gemini-2.5-flash"

[jacpack]
name = 'Replaniva'
description = 'Jac IDE snapshot for Replaniva'

[jachammer]
project_id = "prj_14d504004a854974bf605144571f3dbb"
